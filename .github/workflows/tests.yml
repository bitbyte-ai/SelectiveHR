name: CPU checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -e ".[analysis,test]"
      - run: python -m pytest -q
      - run: python -m selectivehr route --predictions examples/low_predictions.jsonl --output outputs/toy
